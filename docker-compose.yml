# vCosmos observability take-home — starter environment.
#
# This starter deliberately contains NO observability stack. Adding metrics,
# distributed tracing, an OpenTelemetry Collector, a dashboard and an alert is
# the assignment. You are expected to extend this compose file.
#
#   docker compose up --build          # start the two services
#   docker compose --profile loadgen up loadgen   # start traffic (separate step)

services:
  inventory-service:
    build: ./inventory-service
    ports:
      - "8001:8001"
    environment:
      INVENTORY_BASE_LATENCY_MS: "15"
      # Fault scenario is OFF by default. Trigger it at runtime with
      # scripts/trigger_incident.sh (POST /admin/chaos), no restart needed.
      INVENTORY_DEGRADED: "false"
      INVENTORY_DEGRADED_LATENCY_MS: "2000"
      INVENTORY_DEGRADED_PROBABILITY: "0.3"
      # --- 新增 OpenTelemetry 配置 ---
      OTEL_SERVICE_NAME: "inventory-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-service:
    build: ./api-service
    ports:
      - "8000:8000"
    environment:
      INVENTORY_URL: "http://inventory-service:8001"
      UPSTREAM_TIMEOUT_S: "3.0"
      # --- 新增 OpenTelemetry 配置 ---
      OTEL_SERVICE_NAME: "inventory-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
    depends_on:
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Traffic generator. Kept behind a profile so `docker compose up` starts only
  # the services; start traffic explicitly when you want it.
  loadgen:
    build: ./loadgen
    environment:
      TARGET_URL: "http://api-service:8000"
      RPS: "10"
    depends_on:
      - api-service
    profiles: ["loadgen"]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitor-files/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter endpoint (for Prometheus scraper)
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317"        # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitor-files/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - jaeger
